[project]
name = "document-rag-service"
version = "0.1.0"
description = "Production-oriented Retrieval-Augmented Generation service for document ingestion, retrieval, and evidence-based question answering."
readme = "README.md"
authors = [
    { name = "Thiago Memelli", email = "tmemelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "odfpy>=1.4.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0.54",
    "striprtf>=0.0.33",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=6.3.0",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "debugpy>=1.8.22",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
]


[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
asyncio_default_test_loop_scope = "function"


[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]


[[tool.mypy.overrides]]
module = ["odf", "odf.*"]
ignore_missing_imports = true
